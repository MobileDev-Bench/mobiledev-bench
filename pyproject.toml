[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobiledev-bench"
version = "0.1.0"
description = "MobileDev-Bench: A Benchmark for Issue Resolution in Mobile Application Development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "dataclasses-json>=0.6.0",
    "docker==7.1.0",
    "fastcore",
    "ghapi",
    "GitPython",
    "openai>=1.0.0",
    "mini-swe-agent~=2.4.6",
    "openhands-sdk~=1.34",
    "openhands-tools~=1.34",
    "openhands-workspace~=1.34",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "requests",
    "tenacity",
    "toml>=0.10.2",
    "tqdm",
    "unidiff",
    "xmltodict",
]

[project.scripts]
mobiledev-eval = "mobiledev_bench.harness.run_evaluation:main"
mobiledev-infer = "mobiledev_bench.inference.run_inference:main"

[tool.uv]
dev-dependencies = []
