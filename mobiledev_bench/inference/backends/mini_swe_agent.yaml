# mobiledev-infer --config mobiledev_bench/inference/backends/mini_swe_agent.yaml
#
# CLI flags override these (unset flags fall back to this file - see args_util.ArgumentParser).

agent_backend: mini_swe_agent
model: openrouter/anthropic/claude-sonnet-4.5
# Other models we evaluate with:
#   openrouter/qwen/qwen3-coder
#   openrouter/openai/gpt-5.2
#   openrouter/google/gemini-2.5-flash
dataset_files:
  - path/to/dataset.jsonl

step_limit: 250
cost_limit: 1.5
api_key_env: OPENROUTER_API_KEY
container_health_timeout: 600   # image pull timeout - matches android-bench's pull_timeout
docker_platform: linux/amd64    # matches mobiledev-bench's instance images, not the host
reasoning_config_file: mobiledev_bench/inference/backends/mini_swe_agent_reasoning.yaml

# Resolves instance images from GHCR (a bare tag alone fails on a machine that hasn't already
# pulled it - see the pull-access-denied entry in inference/README.md's troubleshooting section).
# Also deletes each image again after its instance finishes, to bound disk usage.
use_remote_images: true
ghcr_username: mobiledev-bench

output_dir: results             # results/<run_name>/<agent_backend>/<model>/...
# run_name:                     # defaults to a timestamp; set to group runs under one batch id
# log_level: INFO
# max_workers: 4                # each worker holds one live container

# Not used by this backend (kept for reference, no effect): base_url, num_retries,
# retry_min_wait, retry_max_wait, openhands_pip_spec.
